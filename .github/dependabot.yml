# Dependabot configuration
# Cooldown delays version updates by 7 days (npm AND github-actions — GitHub supports `default-days` for Actions,
# dependabot-options-reference 2026-08); security updates are processed immediately.
# Reference: https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference
version: 2
updates:

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'wednesday'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 15
    assignees:
      - 'krobipd'
    versioning-strategy: 'increase'
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: '@types/node'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'

  # src-admin (Module-Federation admin component): hand-pinned compatibility matrix
  # (React / MUI / @module-federation/vite — the versions the component was built against);
  # npm-latest breaks the MF build. This entry exists ONLY to satisfy repochecker W8905
  # (a non-root package.json must be covered by a dependabot npm directory). Ignoring all
  # dependencies means it generates ZERO pull requests, so the pinned matrix is never moved.
  # (open-pull-requests-limit: 0 would trip W8907; a wildcard ignore keeps the entry warning-free.)
  - package-ecosystem: 'npm'
    directory: '/src-admin'
    schedule:
      interval: 'weekly'
      day: 'wednesday'
      timezone: 'Europe/Berlin'
    assignees:
      - 'krobipd'
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: '*'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'wednesday'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 15
    assignees:
      - 'krobipd'
    cooldown:
      default-days: 7
