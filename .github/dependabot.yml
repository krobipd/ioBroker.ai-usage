# Dependabot configuration
# Cooldown delays updating normal npm dependencies by 7 days but allows security updates to be processed immediately.
# Note: Cooldown is not supported for the github-actions ecosystem.
# Reference: https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference
version: 2
updates:

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'wednesday'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 15
    assignees:
      - 'krobipd'
    versioning-strategy: 'increase'
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: '@types/node'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'

  # src-admin (Module-Federation admin component): hand-pinned compatibility matrix
  # (React 19 / MUI 9 / @module-federation/vite 1.19.1 …). npm-latest breaks the MF build.
  # This entry exists ONLY to satisfy repochecker W8905 (a non-root package.json must be
  # covered by a dependabot npm directory). Ignoring all dependencies means it generates
  # ZERO pull requests, so the pinned matrix is never moved.
  - package-ecosystem: 'npm'
    directory: '/src-admin'
    schedule:
      interval: 'weekly'
      day: 'thursday'
      timezone: 'Europe/Berlin'
    assignees:
      - 'krobipd'
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: '*'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'wednesday'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 15
    assignees:
      - 'krobipd'
